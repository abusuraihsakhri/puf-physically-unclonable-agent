[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puf-physically-unclonable-engine"
version = "2.0.0"
description = "SRAM & Arbiter Physically Unclonable Function (PUF) Validator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "fastapi>=0.110,<1", "uvicorn>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
puf-validator = "puf_validator.cli:main"
puf-physically-unclonable-engine = "puf_validator.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/puf-physically-unclonable-agent"
Repository = "https://github.com/abusuraihsakhri/puf-physically-unclonable-agent.git"

[tool.setuptools]
packages = ["agents", "puf_validator"]
py-modules = ["cli", "simulator", "enrichment", "puf_validator_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
