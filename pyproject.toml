[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puf-physically-unclonable-engine"
version = "2.0.0"
description = "SRAM & Arbiter Physically Unclonable Function (PUF) Validator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
puf-physically-unclonable-engine = "puf_validator.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/puf-physically-unclonable-engine"
Repository = "https://github.com/abusuraihsakhri/puf-physically-unclonable-engine.git"
