name: PUF Python and browser test suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check Python syntax
      run: python -m compileall -q agents puf_validator cli.py simulator.py enrichment.py

    - name: Run Pytest Suite
      run: pytest -v

    - name: Check browser scripts
      run: |
        node --check web/app.js
        node --test web/app.test.js

    - name: Verify installed dependencies
      run: python -m pip check

    - name: Smoke-test audit signature validation
      run: |
        python - <<'PY'
        from agents.base import AuditTrail
        trail = AuditTrail(secret_key="test-only")
        trail.log("worker", "local", "CHECK", {"status": "ok"})
        assert trail.verify_integrity()
        trail.logs[0]["actor"] = "tampered"
        assert not trail.verify_integrity()
        PY
